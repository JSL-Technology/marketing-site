@if (isOpen) {
  <div class="modal-overlay" @overlayAnimation (click)="onClose()" role="presentation">
    <div
      class="modal-container"
      @modalAnimation
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
      aria-labelledby="exit-modal-title"
      cdkTrapFocus
      cdkTrapFocusAutoCapture>
      <button class="modal-close" (click)="onClose()" [attr.aria-label]="'ARIA.CLOSE_MODAL' | translate">
        <lucide-icon name="X" aria-hidden="true"></lucide-icon>
      </button>

      <div class="modal-content">
        <div class="modal-icon" aria-hidden="true">
          <lucide-icon name="FileText" size="48"></lucide-icon>
        </div>

        <h2 id="exit-modal-title" class="modal-title">{{ 'EXIT_MODAL.TITLE' | translate }}</h2>
        <p class="modal-subtitle">{{ 'EXIT_MODAL.SUBTITLE' | translate }}</p>

        <ul class="modal-benefits">
            <li><lucide-icon name="Check" size="16"></lucide-icon> {{ 'EXIT_MODAL.BENEFIT_1' | translate }}</li>
            <li><lucide-icon name="Check" size="16"></lucide-icon> {{ 'EXIT_MODAL.BENEFIT_2' | translate }}</li>
            <li><lucide-icon name="Check" size="16"></lucide-icon> {{ 'EXIT_MODAL.BENEFIT_3' | translate }}</li>
        </ul>

        <button class="modal-cta" (click)="onConfirm()">
          {{ 'EXIT_MODAL.CTA' | translate }}
        </button>

        <p class="modal-disclaimer">{{ 'EXIT_MODAL.DISCLAIMER' | translate }}</p>
      </div>
    </div>
  </div>
}
