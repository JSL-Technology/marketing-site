<div class="app-shell">
  <jsl-header [class.is-scrolled]="isScrolled()"></jsl-header>

  <main class="main-content">
    <!-- Breadcrumbs disabled: navigation structure uses contextual breadcrumbs per page via schema.org markup instead -->
    <router-outlet></router-outlet>
  </main>

  <jsl-footer></jsl-footer>
  <!-- <jsl-chat-bubble></jsl-chat-bubble> -->

  <jsl-whatsapp-button></jsl-whatsapp-button>

  @if (hasToasts$ | async) {
    <app-toast></app-toast>
  }

  @if (shouldRenderCookieBanner) {
    <app-cookie-banner></app-cookie-banner>
  }

  <jsl-language-suggestion></jsl-language-suggestion>
</div>
