@if (totalPages > 1) {
  <nav class="pagination" [attr.aria-label]="'ARIA.PAGINATION' | translate">
    <button
      class="page-btn prev"
      [disabled]="currentPage === 1"
      (click)="onPageChange(currentPage - 1)"
      [attr.aria-label]="'ARIA.PREVIOUS_PAGE' | translate">
      <lucide-icon [name]="icons.ChevronLeft" [size]="20" aria-hidden="true"></lucide-icon>
    </button>

    <div class="pages">
      @for (page of pages; track $index) {
        @if (page === -1) {
          <span class="ellipsis" aria-hidden="true">...</span>
        } @else {
          <button
            class="page-number"
            [class.active]="page === currentPage"
            (click)="onPageChange(page)"
            [attr.aria-current]="page === currentPage ? 'page' : null"
            [attr.aria-label]="('ARIA.PAGE' | translate) + ' ' + page">
            {{ page }}
          </button>
        }
      }
    </div>

    <button
      class="page-btn next"
      [disabled]="currentPage === totalPages"
      (click)="onPageChange(currentPage + 1)"
      [attr.aria-label]="'ARIA.NEXT_PAGE' | translate">
      <lucide-icon [name]="icons.ChevronRight" [size]="20" aria-hidden="true"></lucide-icon>
    </button>
  </nav>
}
